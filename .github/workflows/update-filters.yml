name: Update community filters

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-filter-update
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile maintained public lists
        run: python tools/compile_filters.py
      - name: Commit changed filter data
        run: |
          git add extension/remote-rules.json extension/domain-model.json
          if git diff --cached --quiet; then
            echo "No filter changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update community filter data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
